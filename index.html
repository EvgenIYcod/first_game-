<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Слайм-Охотник</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a3a5a;font-family:'Segoe UI',Arial,sans-serif;color:#2b1a0a;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
canvas{position:fixed;inset:0;display:block;touch-action:none;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;touch-action:manipulation;-webkit-appearance:none;appearance:none;background:none;text-align:inherit;color:inherit;}
.hidden{display:none!important;}
#tint{position:fixed;inset:0;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(40,30,80,0.05) 0%,rgba(20,10,40,0.08) 100%);}
#vignette{position:fixed;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,0.15) 70%,rgba(0,0,0,0.38) 100%);}
.coin-i{display:inline-block;width:.9em;height:.9em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff2a8 0%,#ffc93c 45%,#b8801a 100%);border:1px solid #7a4f0d;vertical-align:-1px;margin:0 3px;}
.shard-i{display:inline-block;width:.9em;height:.9em;vertical-align:-1px;margin:0 3px;
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:linear-gradient(180deg,#e0c8ff 0%,#a855f7 45%,#6a1a9a 100%);}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:6px;padding:8px 10px;pointer-events:none;flex-wrap:nowrap;}
#title{flex:1;text-align:center;font-weight:900;font-size:12px;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 14px rgba(120,200,255,.6);letter-spacing:.04em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#gold{display:flex;align-items:center;gap:3px;background:linear-gradient(180deg,rgba(70,40,15,.92),rgba(40,20,5,.92));
  border:2px solid #ffc850;border-radius:22px;padding:5px 9px;color:#ffe28a;font-weight:900;font-size:12px;pointer-events:none;flex-shrink:0;}
#gold .coin-i{width:13px;height:13px;margin:0 0 0 2px;}
#shards{display:flex;align-items:center;gap:3px;background:linear-gradient(180deg,rgba(50,20,80,.92),rgba(25,10,45,.92));
  border:2px solid #b880e0;border-radius:22px;padding:5px 9px;color:#e0c8ff;font-weight:900;font-size:12px;pointer-events:none;flex-shrink:0;}
#shards .shard-i{width:13px;height:13px;margin:0 0 0 2px;}
#menuBtn{width:38px;height:38px;border-radius:50%;flex-shrink:0;position:relative;
  background:linear-gradient(180deg,rgba(90,60,25,.9),rgba(50,30,10,.9));color:#f0d9a8;font-size:16px;
  border:2px solid #ffdc9c;pointer-events:auto;display:grid;place-items:center;}
#menuBtn.hasAch::after{content:'';position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
  background:#ff5050;border:2px solid #fff;box-shadow:0 0 10px rgba(255,80,80,.9);animation:badgePulse 1.1s infinite;}
@keyframes badgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
#hpWrap{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:10;width:min(60%,320px);height:24px;
  background:linear-gradient(180deg,#3a2010,#1a0a00);border:3px solid #6b4a20;border-radius:14px;overflow:hidden;pointer-events:none;}
#hpFill{position:absolute;inset:2px;background:linear-gradient(180deg,#ff8080 0%,#e84545 45%,#a01a1a 100%);
  border-radius:10px;transform-origin:left;transition:transform .2s ease-out;}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;}
#statsMini{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:5px;pointer-events:none;flex-wrap:wrap;justify-content:center;padding:0 8px;}
.stMini{background:linear-gradient(180deg,rgba(50,30,10,.85),rgba(20,10,0,.85));border:2px solid rgba(255,200,120,.45);
  border-radius:10px;padding:3px 8px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);}
.stMini .ico{margin-right:3px;}
#petBar{position:fixed;top:130px;right:12px;z-index:12;display:flex;flex-direction:column;gap:5px;pointer-events:none;}
.petSlot{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,rgba(30,20,10,.9),rgba(10,5,0,.9));
  border:2px solid #5a4020;display:grid;place-items:center;pointer-events:auto;cursor:pointer;position:relative;transition:transform .1s;}
.petSlot:active{transform:scale(.92);}
.petSlot.empty{border-style:dashed;opacity:.45;cursor:default;}
.petSlot img{width:88%;height:88%;object-fit:contain;pointer-events:none;}
.petSlot.r0{border-color:#a8a8a8;} .petSlot.r1{border-color:#4a90d4;} .petSlot.r2{border-color:#9a4acc;}
.petSlot.r3{border-color:#ffd050;} .petSlot.r4{border-color:#00e0c0;box-shadow:0 0 14px rgba(0,224,192,.9);}
#bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:10;padding:0 10px 10px;pointer-events:none;width:100%;max-width:460px;}
#panel{background:linear-gradient(180deg,#f0dbb0 0%,#d4b886 50%,#b89860 100%);border:4px solid #4a3016;
  border-radius:16px 16px 8px 8px;padding:9px;position:relative;pointer-events:auto;}
#inv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.slot{aspect-ratio:1;background:linear-gradient(180deg,#fbf3d8 0%,#e8d5a8 55%,#d0bc88 100%);border:2px solid #8b6f47;
  border-radius:9px;display:grid;place-items:center;position:relative;max-height:66px;overflow:hidden;cursor:pointer;transition:transform .1s;}
.slot:active{transform:scale(.94);}
.slot img{width:85%;height:85%;object-fit:contain;pointer-events:none;}
.slot.empty{background:linear-gradient(180deg,#e2cfa0,#c8b482);opacity:.55;cursor:default;}
.slot .lv{position:absolute;bottom:1px;right:2px;font-size:8px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,rgba(80,40,0,.9),rgba(40,20,0,.9));padding:1px 4px;border-radius:6px;line-height:1;}
.slot.r1{box-shadow:0 0 12px rgba(95,211,95,.9);} .slot.r2{box-shadow:0 0 14px rgba(80,160,255,.95);}
.slot.r3{box-shadow:0 0 16px rgba(180,100,255,1);} .slot.r4{box-shadow:0 0 18px rgba(255,144,64,1);}
#floatingBtns{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);z-index:15;
  display:flex;flex-direction:column;gap:26px;pointer-events:none;}
#floatingBtns button{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:3px solid #4a3016;
  background:linear-gradient(180deg,#f0dbb0 0%,#d4b886 50%,#b89860 100%);color:#4a3016;display:grid;place-items:center;transition:transform .1s;position:relative;}
#floatingBtns button:active{transform:scale(.9);}
#floatingBtns button .label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;
  color:#fff;letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none;}
#autoSellBtn.active{border-color:#5fd35f;box-shadow:0 0 12px rgba(95,211,95,.8);}
#eggBtn{border-color:#c8a060;}
#eggBtn .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:linear-gradient(180deg,#ffd54a,#c88000);color:#3a1a00;font-size:11px;font-weight:900;display:grid;place-items:center;
  border:2px solid #2a1500;pointer-events:none;}
#petBtn{border-color:#8ac8ff;background:linear-gradient(180deg,#d0e8ff 0%,#90c0e8 50%,#5080b0 100%);}
#prestigeBtn{border-color:#ff9040!important;background:linear-gradient(180deg,#ffe0b0 0%,#ffb060 50%,#d07020 100%)!important;color:#5a2a00!important;}
#ultBtn{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);z-index:200;width:82px;height:82px;
  border-radius:50%;border:3px solid #8a5acc;background:radial-gradient(circle at 50% 35%, #2a1a4a, #08030f);
  display:grid;place-items:center;cursor:pointer;pointer-events:auto;padding:0;overflow:visible;}
#ultBtn::before{content:'';position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from -90deg,#c88aff 0deg,#c88aff var(--p, 0deg),rgba(120,60,180,0.12) var(--p, 0deg),rgba(120,60,180,0.12) 360deg);z-index:0;pointer-events:none;}
#ultBtn.ready{border-color:#e0b0ff;background:radial-gradient(circle at 50% 35%, #5a2a9a, #1a0540);box-shadow:0 0 30px rgba(180,100,255,.95);}
#ultBtn:active{transform:scale(.92);}
#ultBtn .ult-icon{font-size:34px;line-height:1;position:relative;z-index:2;color:#fff;}
#ultBtn .ult-count{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;
  z-index:3;background:rgba(10,5,20,.85);padding:1px 8px;border-radius:8px;white-space:nowrap;border:1px solid rgba(200,140,255,.4);}
#ultBtn.ready .ult-count{background:linear-gradient(180deg,#c88aff,#5a1a9a);border-color:#e0b0ff;}
#ultBtn .ult-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#e8c0ff;letter-spacing:.08em;white-space:nowrap;}
#ultBtn.hidden{display:none;}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);left:50%;transform:translateX(-50%);
  padding:8px 16px;background:linear-gradient(180deg,rgba(30,50,30,.95),rgba(15,30,15,.95));color:#ffe28a;font-size:14px;font-weight:900;
  border-radius:12px;border:2px solid rgba(255,213,74,.6);z-index:100;pointer-events:none;display:flex;align-items:center;gap:4px;}
.toast.out{opacity:0;transition:opacity .4s;}
.toast.purple{background:linear-gradient(180deg,rgba(40,20,60,.98),rgba(25,10,45,.98));border-color:rgba(180,100,255,.8);color:#e0c8ff;}
#returnBanner{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .4s;}
#returnBanner.on{opacity:1;}
#returnBanner .rb-inner{padding:28px 40px;border-radius:20px;background:linear-gradient(180deg,rgba(20,10,40,.92),rgba(10,5,20,.92));
  border:3px solid rgba(255,213,74,.5);text-align:center;}
#returnBanner .rb-icon{font-size:56px;line-height:1;margin-bottom:8px;}
#returnBanner .rb-title{font-size:13px;letter-spacing:.3em;color:#ff8a8a;font-weight:800;margin-bottom:4px;}
#returnBanner .rb-text{font-size:22px;font-weight:900;color:#fff;}
#returnBanner .rb-sub{font-size:12px;color:#a8c8e0;font-weight:700;margin-top:10px;}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.78);overflow-y:auto;}
.mpanel{width:100%;max-width:380px;margin:auto;}
.banner{text-align:center;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff5a5a 0%,#c22a1a 50%,#8a0a0a 100%);
  padding:8px 12px;border-radius:12px;margin-bottom:10px;text-shadow:0 2px 4px rgba(0,0,0,.7);border:2px solid rgba(255,180,180,.4);letter-spacing:.06em;}
.card{background:linear-gradient(180deg,#fdf5dc 0%,#f0dfb6 60%,#e0cba0 100%);border:4px solid #8e8e8e;border-radius:14px;padding:10px;text-align:center;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.6);}
.card.r0{border-color:#8e8e8e;} .card.r1{border-color:#5fd35f;} .card.r2{border-color:#4a90d4;}
.card.r3{border-color:#9a4acc;} .card.r4{border-color:#ff9040;}
.card.prestige{border-color:#ff9040;background:linear-gradient(180deg,#fff5dc 0%,#ffe0b0 60%,#f0c880 100%);}
.card.egg-reveal{background:linear-gradient(180deg,#4a2c14 0%,#2a1808 55%,#1a0e04 100%);border-color:#c89850;color:#f0dcb0;}
.card.egg-reveal .title-h{color:#ffd88a;} .card.egg-reveal .sub-h{color:#d8b088;}
.card.dark{background:linear-gradient(180deg,#2a1a3a 0%,#1a0e2a 55%,#0a0515 100%);border-color:#8a5acc;color:#e0d0ff;}
.card.dark .title-h{color:#d0b0ff;} .card.dark .sub-h{color:#a890c8;}
.card.dark .sp-item,.card.dark .spet-item{background:linear-gradient(180deg,rgba(90,55,155,.55),rgba(45,22,90,.55));
  border:2px solid rgba(170,120,230,.7);border-radius:12px;padding:10px 12px;color:#e8dcff;width:100%;text-align:left;margin-bottom:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);position:relative;}
.card.dark .sp-item.disabled,.card.dark .spet-item.disabled{opacity:.5;filter:grayscale(.4);cursor:not-allowed;}
.card.dark .sp-item.owned,.card.dark .spet-item.owned{border-color:rgba(95,211,95,.8);background:linear-gradient(180deg,rgba(95,211,95,.22),rgba(42,138,42,.15));}
.card.dark .sp-item .sp-name,.card.dark .spet-item .spet-name{font-size:13px;font-weight:900;color:#f0e4ff;margin-bottom:2px;line-height:1.2;}
.card.dark .sp-item .sp-desc,.card.dark .spet-item .spet-desc{font-size:11px;color:#b8a8d8;font-weight:700;line-height:1.35;}
.card.dark .sp-item .sp-ico{font-size:20px;width:40px;height:40px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%, rgba(220,170,255,.4), rgba(90,45,150,.55));
  border:2px solid rgba(190,140,240,.6);border-radius:50%;flex-shrink:0;}
.card.dark .spet-item img{width:44px;height:44px;flex-shrink:0;padding:2px;
  background:radial-gradient(circle at 50% 35%, rgba(220,170,255,.3), rgba(90,45,150,.5));
  border:2px solid rgba(190,140,240,.6);border-radius:50%;object-fit:contain;}
.card.dark .sp-item .sp-cost,.card.dark .spet-item .spet-cost{background:linear-gradient(180deg,#ffe680 0%,#ffc850 45%,#c89020 100%);
  color:#3a1a00;border:2px solid #7a5000;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:900;
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 1px 1px rgba(255,255,255,.5);
  display:inline-flex;align-items:center;gap:3px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.card.dark .sp-item .sp-cost .shard-i,.card.dark .spet-item .spet-cost .shard-i{width:14px;height:14px;margin:0;}
.card.dark .spet-item.owned .spet-cost{background:linear-gradient(180deg,#8ff06f,#2a8a2a);color:#fff;border-color:#1a5a1a;}
.card.dark .menu-item{background:linear-gradient(180deg,rgba(90,55,155,.55),rgba(45,22,90,.55));border:2px solid rgba(170,120,230,.7);color:#e8dcff;border-radius:12px;}
.card.dark .menu-item .m-txt{color:#e8dcff;} .card.dark .menu-item .m-arrow{color:#a890c8;}
.card.dark .as-item{background:linear-gradient(180deg,rgba(90,55,155,.55),rgba(45,22,90,.55));border-color:rgba(170,120,230,.7);color:#e8dcff;}
.card.dark .as-item .as-name{color:#e8dcff;}
.card.dark .ach-summary{background:linear-gradient(180deg,rgba(200,140,255,.22),rgba(140,60,220,.18));border-color:rgba(200,140,255,.55);color:#e0c8ff;}
.card.dark .ach-summary b{color:#ffd88a;}
.sp-item .inner,.spet-item .inner,.menu-item .inner,.as-item .inner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;}
.spet-item .inner,.sp-item .inner{gap:12px;}
.tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:3px 14px;font-size:9.5px;font-weight:900;letter-spacing:.16em;
  color:#fff;border-radius:8px;border:2px solid rgba(0,0,0,.35);background:#8e8e8e;white-space:nowrap;}
.r0 .tag{background:linear-gradient(180deg,#a8a8a8,#5a5a5a);} .r1 .tag{background:linear-gradient(180deg,#8ff06f,#2a8a2a);}
.r2 .tag{background:linear-gradient(180deg,#7fc0ff,#2a70c4);} .r3 .tag{background:linear-gradient(180deg,#c88aff,#7a2aa8);}
.r4 .tag{background:linear-gradient(180deg,#ffb040,#a04000);}
.icbox{width:96px;height:96px;margin:10px auto 8px;background:radial-gradient(circle at 50% 35%,#ffffff 0%,#f0e0b8 45%,#c8b088 100%);
  border:3px solid #b0a078;border-radius:12px;display:grid;place-items:center;}
.icbox img{width:80%;height:80%;object-fit:contain;}
.iname{font-size:15px;font-weight:900;color:#3a2a10;line-height:1.2;}
.ilvl{font-size:10.5px;color:#8a7050;font-weight:700;margin-top:2px;}
.title-h{font-size:18px;font-weight:900;color:#3a2a10;text-align:center;margin-bottom:4px;}
.sub-h{font-size:11.5px;color:#7a6040;font-weight:700;text-align:center;margin-bottom:12px;}
.acts{display:flex;gap:8px;margin-top:10px;}
.acts button{flex:1;padding:12px 4px;border-radius:11px;font-size:12px;font-weight:900;color:#fff;border:3px solid #2a1a0a;
  text-shadow:0 2px 3px rgba(0,0,0,.6);box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .08s;display:flex;flex-direction:column;gap:2px;align-items:center;letter-spacing:.03em;}
.acts button:active{transform:translateY(3px);}
.acts button:disabled{opacity:.5;filter:grayscale(.4);cursor:not-allowed;}
.bsell{background:linear-gradient(180deg,#ff8070 0%,#e84545 50%,#a01818 100%);}
.bequip{background:linear-gradient(180deg,#a0e870 0%,#4fb830 50%,#287818 100%);}
.bclose{background:linear-gradient(180deg,#b89870 0%,#7a5a38 50%,#4a3018 100%);}
.bprestige{background:linear-gradient(180deg,#ffc060 0%,#ff8020 50%,#a04000 100%);border-color:#5a2a00!important;}
.begg{background:linear-gradient(180deg,#ffe0b0 0%,#e8a860 50%,#a06818 100%);border-color:#4a2a00!important;color:#3a1a00;}
.bpurple{background:linear-gradient(180deg,#c88aff 0%,#7a3ac4 50%,#4a1a8a 100%);border-color:#2a0a5a!important;}
.bred{background:linear-gradient(180deg,#ff6060 0%,#c01a1a 50%,#7a0a0a 100%);border-color:#3a0505!important;}
.bgold{background:linear-gradient(180deg,#ffd54a 0%,#c89020 50%,#7a5000 100%);border-color:#3a2000!important;color:#2a1500;}
.reroll-btn{background:linear-gradient(180deg,#c88aff 0%,#7a3ac4 50%,#4a1a8a 100%);border-color:#2a0a5a!important;}
.reroll-btn.gold{background:linear-gradient(180deg,#ffd54a 0%,#c89020 50%,#7a5000 100%);border-color:#3a2000!important;color:#2a1500;}
.up{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:linear-gradient(180deg,#a0e870 0%,#4fb830 50%,#287818 100%);
  color:#fff;font-size:13px;font-weight:900;letter-spacing:.06em;border:3px solid #2a6a18;box-shadow:0 4px 0 rgba(0,0,0,.4);}
.up:disabled{opacity:.5;filter:grayscale(.4);}
.up:active{transform:translateY(3px);}
.x{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#ff8070,#a01818);
  color:#fff;font-size:20px;font-weight:900;border:3px solid #2a1a0a;display:grid;place-items:center;line-height:1;}
.big-stats{background:linear-gradient(180deg,#fffbf0,#f0e0b8);border:2px solid #d4c098;border-radius:10px;padding:6px;margin-bottom:10px;}
.big-stat{display:flex;justify-content:space-between;padding:7px 9px;font-weight:800;font-size:12px;color:#3a2a10;border-bottom:1px dashed rgba(120,80,30,.22);}
.big-stat:last-child{border-bottom:none;}
.big-stat .nm{display:flex;align-items:center;gap:6px;}
.big-stat .vl{color:#1a7a1a;font-weight:900;font-size:13px;}
.big-stat .vl.hp{color:#c22a1a;} .big-stat .vl.crit{color:#a04ac4;} .big-stat .vl.spd{color:#1a6ac4;}
.big-stat .vl.danger{color:#c02020;} .big-stat .vl.ult{color:#8a4ac4;} .big-stat .vl.prestige{color:#d06000;} .big-stat .vl.pet{color:#1a5a8a;}
.ult-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 10px;
  background:linear-gradient(180deg,#f4e8ff,#e0c8f8);border:2px solid #b880e0;border-radius:12px;cursor:pointer;}
.ult-row:active{transform:scale(.98);}
.ult-row.locked{background:linear-gradient(180deg,#e8e0d0,#d0c4b0);border-color:#8a7860;cursor:default;opacity:.75;}
.ult-row .u-ico{width:40px;height:40px;flex-shrink:0;background:radial-gradient(circle at 50% 35%,#c88aff,#5a1a9a);

function fmtNum(v){if(v===null||v===undefined||isNaN(v)||!isFinite(v))return "0";var r=Math.round(v*10)/10;
  if(Math.abs(r-Math.round(r))<0.05)return String(Math.round(r));return r.toFixed(1);}
function fmtPrice(v){return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function cleanFloatStr(s){if(typeof s!=="string")return String(s);return s.replace(/(\d+\.\d{2,})/g,function(m){
  var n=parseFloat(m);if(isNaN(n))return m;var r=Math.round(n*10)/10;
  if(Math.abs(r-Math.round(r))<0.05)return String(Math.round(r));return r.toFixed(1);});}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hexRgb(h){if(h.indexOf("rgb")===0){var m=h.match(/\d+/g);return{r:parseInt(m[0]),g:parseInt(m[1]),b:parseInt(m[2])};}
  h=h.replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");
  return{r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};}
function mixCol(a,b,t){var ca=hexRgb(a),cb=hexRgb(b);
  return "rgb("+Math.round(ca.r+(cb.r-ca.r)*t)+","+Math.round(ca.g+(cb.g-ca.g)*t)+","+Math.round(ca.b+(cb.b-ca.b)*t)+")";}
function shadeHex(hex,amt){var c=hexRgb(hex);
  return "rgb("+clamp(Math.round(c.r+amt),0,255)+","+clamp(Math.round(c.g+amt),0,255)+","+clamp(Math.round(c.b+amt),0,255)+")";}

/* ===== СПРАЙТЫ (загрузка PNG) ===== */
var SPRITE_CACHE = {}; // { "file.png": {img: Image, loaded: true} }
var SPRITE_MAP = {

function preloadBackgrounds(){
  for (var idx in BG_MAP){

}

function drawBgImage(themeIdx){
  var img = BG_CACHE[themeIdx];
  if (!img) return false;
  var imgW = img.naturalWidth, imgH = img.naturalHeight;
  var scale = Math.max(W / imgW, H / imgH);
  var drawW = imgW * scale;
  var drawH = imgH * scale;
  var drawX = (W - drawW) / 2;
  var drawY = H - drawH; // низ прижат к низу экрана
  ctx.drawImage(img, drawX, drawY, drawW, drawH);
  return true;
}
function removeCheckerBg(img){
  try {
    var w = img.naturalWidth, h = img.naturalHeight;
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    var imgData = g.getImageData(0, 0, w, h);
    var d = imgData.data;

    // Пиксель — "фон", если он серо-белый и светлый
    function isBg(r, gg, b){
      var maxd = Math.max(Math.abs(r-gg), Math.abs(gg-b), Math.abs(r-b));
      var bright = (r + gg + b) / 3;
      return maxd < 35 && bright > 100;
    }

    var visited = new Uint8Array(w * h);
    var stack = [];
    var x, y, idx;

    // Стартовые точки — все пиксели по периметру, которые уже фон
    for (x = 0; x < w; x++){
      var topI = x;
      if (isBg(d[topI*4], d[topI*4+1], d[topI*4+2])){ visited[topI] = 1; stack.push(topI); }
      var botI = (h-1)*w + x;
      if (isBg(d[botI*4], d[botI*4+1], d[botI*4+2])){ visited[botI] = 1; stack.push(botI); }
    }
    for (y = 0; y < h; y++){
      var leftI = y*w;
      if (isBg(d[leftI*4], d[leftI*4+1], d[leftI*4+2])){ visited[leftI] = 1; stack.push(leftI); }
      var rightI = y*w + (w-1);
      if (isBg(d[rightI*4], d[rightI*4+1], d[rightI*4+2])){ visited[rightI] = 1; stack.push(rightI); }
    }

    // Обход в глубину: от краёв идём вглубь, где пиксели ещё "серо-белые"
    while (stack.length){
      idx = stack.pop();
      d[idx*4 + 3] = 0;  // прозрачность
      y = Math.floor(idx / w);
      x = idx - y*w;
      var n;
      if (x > 0 && !visited[idx-1]){ n = (idx-1)*4;
        if (isBg(d[n], d[n+1], d[n+2])){ visited[idx-1] = 1; stack.push(idx-1); } }
      if (x < w-1 && !visited[idx+1]){ n = (idx+1)*4;
        if (isBg(d[n], d[n+1], d[n+2])){ visited[idx+1] = 1; stack.push(idx+1); } }
      if (y > 0 && !visited[idx-w]){ n = (idx-w)*4;
        if (isBg(d[n], d[n+1], d[n+2])){ visited[idx-w] = 1; stack.push(idx-w); } }
      if (y < h-1 && !visited[idx+w]){ n = (idx+w)*4;
        if (isBg(d[n], d[n+1], d[n+2])){ visited[idx+w] = 1; stack.push(idx+w); } }
    }

    g.putImageData(imgData, 0, 0);
    console.log("[Фон удалён для спрайта " + w + "x" + h + "]");
    return c;
  } catch(e){
    console.warn("[Ошибка удаления фона] " + e.message);
    return img;
  }
}
function loadOneSprite(f, loadedList){
  if (loadedList.indexOf(f) !== -1) return;
  loadedList.push(f);
  var img = new Image();
  img.onload = function(){
    var clean = removeCheckerBg(img);
    SPRITE_CACHE[f] = {img: clean, loaded: true};
    console.log("[Спрайт загружен] " + f);
  };
  img.onerror = function(){
    console.warn("[Спрайт не найден] sprites/" + f);
  };
  img.src = "sprites/" + f;
}
function preloadSprites(){
  var loaded = [];
  for (var key in SPRITE_MAP){
    var entry = SPRITE_MAP[key];
    if (entry.file) loadOneSprite(entry.file, loaded);
    if (entry.fileHurt) loadOneSprite(entry.fileHurt, loaded);
  }
}
function getSpriteForEnemy(e){
  if (!e || !e.name) return null;
  var entry = SPRITE_MAP[e.name];
  if (!entry) return null;
  var file = entry.file;
  // Если враг получил удар и есть hurt-версия — используем её
  if (e.hitFlash > 0.45 && entry.fileHurt){
    var hurtCached = SPRITE_CACHE[entry.fileHurt];
    if (hurtCached && hurtCached.loaded) file = entry.fileHurt;
  }
  var cached = SPRITE_CACHE[file];
  if (!cached || !cached.loaded) return null;
  return {img: cached.img, scale: entry.scale};
}

function drawPetIconOnCanvas(c,pet){var g=c.getContext("2d");var size=c.width;var cx=size/2,cy=size/2;var r=size*0.36;
  if(pet.col==="rainbow"){var grad=g.createLinearGradient(0,0,size,size);grad.addColorStop(0,"#ff4040");

  g.strokeStyle="#1a0a05";g.lineWidth=size*0.045;g.stroke();

  g.strokeStyle="#1a0a05";g.lineWidth=size*0.035;g.lineCap="round";

function totalAchClaimed(){var n=0;for(var i=0;i<ACH_CHAINS.length;i++)n+=(G.achLevels[ACH_CHAINS[i].id]||0);return n;}
function totalAchSteps(){var n=0;for(var i=0;i<ACH_CHAINS.length;i++)n+=ACH_CHAINS[i].steps.length;return n;}
function chainClaimable(chain){var lvl=G.achLevels[chain.id]||0;if(lvl>=chain.steps.length)return false;return chain.metric()>=chain.steps[lvl];}
function anyClaimable(){for(var i=0;i<ACH_CHAINS.length;i++)if(chainClaimable(ACH_CHAINS[i]))return true;return false;}
function claimChain(id){var c=getChain(id);if(!c)return 0;var lvl=G.achLevels[c.id]||0;if(lvl>=c.steps.length)return 0;
  if(c.metric()<c.steps[lvl])return 0;var reward=c.shards[lvl];G.shards+=reward;
  PERSIST.totalShardsEarned=(PERSIST.totalShardsEarned||0)+reward;G.achLevels[c.id]=lvl+1;saveProgress();return reward;}
function claimAllAchievements(){var count=0;var safety=0;while(safety<300){var anyClaimed=false;
  for(var i=0;i<ACH_CHAINS.length;i++){var c=ACH_CHAINS[i];var guard=0;while(guard<100){
    var before=G.achLevels[c.id]||0;var r=claimChain(c.id);if(r<=0)break;
    var after=G.achLevels[c.id]||0;if(after===before)break;count++;anyClaimed=true;guard++;}}
  if(!anyClaimed)break;safety++;}return count;}

function drawSpriteSlime(e, pos, sprite){
  var t = performance.now()/1000;
  var bob = Math.sin(t*3 + e.wobble)*0.06;
  var sq = e.squash || 0;
  var r = pos.size*0.5;
  var grow = e.spawnAnim || 1;
  var flash = e.hitFlash || 0;
  var isPain = flash > 0.35;
  var lungeScale = pos.lungeScale || 1;
  var painTilt = isPain ? Math.sin(t*40) * 0.05 : 0;
  var img = sprite.img;
  var imgSize = pos.size * sprite.scale;

  // 1. Тень под слаймом
  ctx.save();
  var shR = r * 2.2;
  var shGrad = ctx.createRadialGradient(pos.x, pos.y + r*0.45, 0, pos.x, pos.y + r*0.45, shR);
  shGrad.addColorStop(0, "rgba(5,15,0,"+(0.5*grow)+")");
  shGrad.addColorStop(0.35, "rgba(8,18,2,"+(0.3*grow)+")");
  shGrad.addColorStop(0.7, "rgba(10,20,3,"+(0.12*grow)+")");
  shGrad.addColorStop(1, "rgba(10,20,3,0)");
  ctx.fillStyle = shGrad;
  ctx.beginPath();
  ctx.ellipse(pos.x, pos.y + r*0.45, shR, shR*0.32, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // 2. Свечение позади (если бьют — сильнее)
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = (0.22 + Math.sin(t*3)*0.04 + flash*0.4) * grow;
  var gs = r*2.6;
  var gg = ctx.createRadialGradient(pos.x, pos.y - r*0.3, 0, pos.x, pos.y - r*0.3, gs);
  gg.addColorStop(0, e.col);
  gg.addColorStop(0.5, e.col2 || e.col);
  gg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gg;
  ctx.fillRect(pos.x-gs, pos.y-r-gs, gs*2, gs*2);
  ctx.restore();

  // 3. Сам спрайт с анимациями
  ctx.save();
  ctx.translate(pos.x, pos.y + bob*r);
  ctx.rotate(painTilt);
  var sx = grow * lungeScale * (1 + sq*0.15);
  var sy = grow * lungeScale * (1 - sq*0.18);
  ctx.scale(sx, sy);
  ctx.drawImage(img, -imgSize/2, -imgSize, imgSize, imgSize);
  ctx.restore();

  // 4. Лёгкая вспышка при ударе (ослаблено — чтобы hurt-спрайт было видно)
  if (flash > 0.6){
    ctx.save();
    ctx.globalAlpha = (flash - 0.6) * 0.6;
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(img, pos.x - imgSize/2, pos.y + bob*r - imgSize, imgSize, imgSize);
    ctx.restore();
  }
}

function slimeBodyPath(shape,rw,rh,wobble,t){ctx.beginPath();
  if(shape==="spiky"){var spikes=12;for(var i=0;i<spikes*2;i++){var a=(i/(spikes*2))*Math.PI*2-Math.PI/2;
    var isSpike=i%2===1;var rr=isSpike?1.55:0.95;if(isSpike)rr+=Math.sin(i*1.7+wobble)*0.1;
    var px=Math.cos(a)*rw*rr;var py=Math.sin(a)*rh*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}}
  else if(shape==="horns"){ctx.moveTo(-rw,rh*0.5);
    ctx.bezierCurveTo(-rw*1.05,-rh*0.6,-rw*1.0,-rh*1.0,-rw*0.72,-rh*1.15);ctx.lineTo(-rw*0.5,-rh*1.35);
    ctx.bezierCurveTo(-rw*0.3,-rh*1.5,rw*0.3,-rh*1.5,rw*0.5,-rh*1.35);ctx.lineTo(rw*0.72,-rh*1.15);
    ctx.bezierCurveTo(rw*1.0,-rh*1.0,rw*1.05,-rh*0.6,rw,rh*0.5);ctx.bezierCurveTo(rw*0.9,rh*0.75,-rw*0.9,rh*0.75,-rw,rh*0.5);}
  else if(shape==="bubbly"){ctx.moveTo(-rw,rh*0.5);
    ctx.bezierCurveTo(-rw*1.15,-rh*0.9,-rw*1.0,-rh*1.15,-rw*0.6,-rh*1.05);
    ctx.bezierCurveTo(-rw*0.4,-rh*1.0,-rw*0.15,-rh*1.35,rw*0.1,-rh*1.2);
    ctx.bezierCurveTo(rw*0.3,-rh*1.1,rw*0.45,-rh*1.35,rw*0.65,-rh*1.1);
    ctx.bezierCurveTo(rw*0.9,-rh*0.85,rw*1.05,-rh*0.7,rw,rh*0.5);ctx.bezierCurveTo(rw*0.9,rh*0.75,-rw*0.9,rh*0.75,-rw,rh*0.5);}
  else if(shape==="ice"){ctx.moveTo(-rw,rh*0.5);
    ctx.bezierCurveTo(-rw*1.05,-rh*0.8,-rw*0.9,-rh*1.1,-rw*0.5,-rh*1.05);ctx.lineTo(-rw*0.25,-rh*1.15);ctx.lineTo(0,-rh*1.1);
    ctx.lineTo(rw*0.25,-rh*1.15);ctx.lineTo(rw*0.5,-rh*1.05);ctx.bezierCurveTo(rw*0.9,-rh*1.1,rw*1.05,-rh*0.8,rw,rh*0.5);
    ctx.bezierCurveTo(rw*0.9,rh*0.75,-rw*0.9,rh*0.75,-rw,rh*0.5);}
  else if(shape==="fire"){ctx.moveTo(-rw,rh*0.5);
    ctx.bezierCurveTo(-rw*1.05,-rh*1.1,-rw*0.5,-rh*1.2,0,-rh*1.15);ctx.bezierCurveTo(rw*0.5,-rh*1.2,rw*1.05,-rh*1.1,rw,rh*0.5);
    ctx.bezierCurveTo(rw*0.9,rh*0.75,-rw*0.9,rh*0.75,-rw,rh*0.5);}
  else{ctx.moveTo(-rw,rh*0.5);ctx.bezierCurveTo(-rw*1.05,-rh*1.2,-rw*0.5,-rh*1.3,0,-rh*1.25);
    ctx.bezierCurveTo(rw*0.5,-rh*1.3,rw*1.05,-rh*1.2,rw,rh*0.5);ctx.bezierCurveTo(rw*0.9,rh*0.75,-rw*0.9,rh*0.75,-rw,rh*0.5);}
  ctx.closePath();}
function drawSlime(e,pos){
  // Проверяем спрайт
  var sprite = getSpriteForEnemy(e);
  if (sprite){
    drawSpriteSlime(e, pos, sprite);
    return;
  }
  // ... иначе — старая отрисовка кодом (fallback)

  var wx=1+Math.sin(t*4.2+e.wobble)*0.05;var wy=1+Math.cos(t*3.6+e.wobble)*0.06;var sq=e.squash||0;var r=pos.size*0.5;
  var rw=r*wx*(1+sq*0.15),rh=r*wy*(1-sq*0.18);var grow=e.spawnAnim||1;var flash=e.hitFlash||0;var isPain=flash>0.35;var shape=e.shape||"round";

  ctx.save();ctx.globalCompositeOperation="lighter";ctx.globalAlpha=(0.22+Math.sin(t*3)*0.04+flash*0.4)*grow;var gs=rw*2.6;
  var gg=ctx.createRadialGradient(pos.x,pos.y-rh*0.3,0,pos.x,pos.y-rh*0.3,gs);
  gg.addColorStop(0,e.col);gg.addColorStop(0.5,e.col2||e.col);gg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=gg;ctx.fillRect(pos.x-gs,pos.y-rh-gs,gs*2,gs*2);ctx.restore();
  var cy=pos.y-rh*0.30+bob*r;var lungeScale=pos.lungeScale||1;var painTilt=isPain?Math.sin(t*40)*0.08:0;
  ctx.save();ctx.translate(pos.x,cy);ctx.scale(grow*lungeScale,grow*lungeScale);ctx.rotate(painTilt);
  if(shape==="ringed"){ctx.save();ctx.globalCompositeOperation="lighter";var ringR=rw*1.55;
    ctx.globalAlpha=(0.85+Math.sin(t*3)*0.15)*grow;var ringGrad=ctx.createRadialGradient(0,0,ringR*0.85,0,0,ringR*1.15);
    ringGrad.addColorStop(0,"rgba(0,0,0,0)");ringGrad.addColorStop(0.5,e.col);ringGrad.addColorStop(0.8,"#ffffff");ringGrad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=ringGrad;ctx.beginPath();ctx.ellipse(0,0,ringR*1.2,ringR*1.15,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,0,ringR,ringR*0.95,0,0,Math.PI*2);ctx.strokeStyle="#ffffff";ctx.lineWidth=3;ctx.stroke();ctx.restore();}
  if(shape==="fire"){ctx.save();ctx.globalCompositeOperation="lighter";
    for(var f=0;f<8;f++){var fa=(f/8)*Math.PI*2+t*1.2;var fr=rw*1.35;var fx=Math.cos(fa)*fr;var fy=Math.sin(fa)*rh*1.35-rh*0.35;
      var fsz=rw*(0.55+Math.sin(t*6+f*1.3)*0.18);var fg=ctx.createRadialGradient(fx,fy,0,fx,fy,fsz);
      fg.addColorStop(0,"#fff8c8");fg.addColorStop(0.35,"#ffcc44");fg.addColorStop(0.7,e.col);fg.addColorStop(1,"rgba(200,50,0,0)");
      ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(fx,fy-fsz);ctx.quadraticCurveTo(fx+fsz*0.8,fy-fsz*0.2,fx,fy+fsz*0.6);

  slimeBodyPath(shape,rw,rh,e.wobble,t);
  var lightCol=shadeHex(e.col,70);var darkCol=e.col2||shadeHex(e.col,-20);var deepCol=e.dark||shadeHex(e.col,-60);
  if(flash>0){lightCol=mixCol(lightCol,"#ffffff",flash);darkCol=mixCol(darkCol,"#ffffff",flash*0.7);deepCol=mixCol(deepCol,"#ffffff",flash*0.5);}

function runRoulette(cells,winnerIdx,onDone){var totalSteps=30+winnerIdx;var startTime=performance.now();var duration=2400;var last=-1;

  requestAnimationFrame(frame);}

function buySpeedup(id){var sp=null;for(var i=0;i<SPEEDUPS.length;i++)if(SPEEDUPS[i].id===id)sp=SPEEDUPS[i];
  if(!sp)return;if(G.shards<sp.price)return;if(id==="charge"&&!isUltUnlocked())return;G.shards-=sp.price;
  if(id==="reroll"){G.rerollCharges++;showToast('🎲 Ре-ролл куплен!','purple',2200);}
  else if(id==="goldReroll"){G.goldRerollCharges++;showToast('✨ Золотой ре-ролл куплен!','purple',2200);}
  else if(id==="resurrect"){G.buffs.resurrection=true;showToast('💀 Воскрешение','purple',1800);}
  else if(id==="dream"){doGrantItem(3);}
  else if(id==="legend"){doGrantItem(4);}
  else if(id==="bossGift"){G.buffs.guaranteedEgg=true;showToast('🎁 След. босс даст яйцо','purple',2000);}
  else if(id==="charge"){G.ultCharge=ultMaxCharge();updateUltButton();showToast('⚡ Ульта заряжена!','purple',1600);}
  else if(id==="rage"){G.buffs.rage=5;showToast('🔥 +50% урона','purple',1800);}
  else if(id==="shield"){G.buffs.shield=3;showToast('🛡️ Иммунитет на 3 боя','purple',1800);}
  saveProgress();updateHud();
  if(el("modals").innerHTML.indexOf("УСКОРИТЕЛИ")!==-1)showSpeedups();}
function doGrantItem(rarity){var mul=1+(G.prestigeBonus||0);var slot=SLOTS[Math.floor(Math.random()*SLOTS.length)];
  var pool=POOLS[slot];var maxI=pool.length-1;var baseIdx=Math.min(maxI,rarity+(Math.random()<0.3?1:0));
  var base=pool[Math.max(0,Math.min(maxI,baseIdx))];var lvl=1+Math.floor(Math.random()*(1+Math.min(rarity,3)));var st={};
  for(var k in base.stats){var v=base.stats[k];var lvlMult=1+(lvl-1)*0.08;var rarMult=1+rarity*0.05;var val;
    if(k==="atkSpeed"){val=Math.round(v*lvlMult*rarMult*10)/10;}
    else if(k==="crit"||k==="critMult"){val=Math.round(v*lvlMult*rarMult);}
    else{val=Math.round(v*lvlMult*rarMult*mul*10)/10;}
    if(val<v)val=v;st[k]=val;}
  if(rarity>=1)st.crit=(st.crit||0)+Math.floor(rarity/2);if(rarity>=2)st.critMult=(st.critMult||0)+rarity*4;
  var sell=8+rarity*18+lvl*4+Math.floor(Math.random()*5);
  var item={name:base.n,shape:base.shape,c1:base.c1,c2:base.c2,slot:slot,tier:rarity,level:lvl,stats:st,sellPrice:sell};
  clearModals();showLoot(item);}

function importSaveCode(str){if(!str||typeof str!=="string")return{ok:false,err:"Пустая строка"};str=str.trim();
  var prefix="SLIME1:";
  if(str.indexOf("SLIME5:")===0)prefix="SLIME5:";
  else if(str.indexOf("SLIME4:")===0)prefix="SLIME4:";
  else if(str.indexOf("SLIME3:")===0)prefix="SLIME3:";
  else if(str.indexOf("SLIME2:")===0)prefix="SLIME2:";
  else if(str.indexOf("SLIME1:")===0)prefix="SLIME1:";
  else return{ok:false,err:"Неверный формат"};
  var b64=str.substring(prefix.length);var data;
  try{data=JSON.parse(decodeURIComponent(escape(atob(b64))));}catch(e){return{ok:false,err:"Не удалось прочитать"};}
  try{
    G.gold=data.g||0;G.level=data.l||1;G.ultLevel=data.ul||1;G.ultCharge=data.uc||0;
    G.prestige=data.p||0;G.prestigeBonus=data.pb||0;G.eggs=data.e||0;
    G.pets={};(data.pets||[]).forEach(function(id){if(getPet(id))G.pets[id]=true;});
    G.activePets=[null,null,null];(data.ap||[]).forEach(function(id,i){if(i<3&&(G.pets[id]||getSpecialPet(id)))G.activePets[i]=id;});
    G.specialPets={};(data.sp||[]).forEach(function(id){if(getSpecialPet(id))G.specialPets[id]=true;});
    G.shards=data.sh||0;G.achLevels={};
    if(data.al&&typeof data.al==="object"){for(var ck in data.al){if(getChain(ck)&&typeof data.al[ck]==="number"&&data.al[ck]>=0)G.achLevels[ck]=data.al[ck]|0;}}
    G.skills={};
    if(data.sk&&typeof data.sk==="object"){for(var skk in data.sk){if(getSkill(skk)&&typeof data.sk[skk]==="number"&&data.sk[skk]>=0&&data.sk[skk]<=SKILL_MAX_LVL)G.skills[skk]=data.sk[skk]|0;}}
    PERSIST.autoSell=Array.isArray(data.as)?data.as:[];PERSIST.totalBossesKilled=data.tb||0;
    PERSIST.totalEggsOpened=data.te||0;PERSIST.totalUltsUsed=data.tu||0;G.firstBossBeaten=!!data.fb;
    G.rerollCharges=data.rc||0;G.goldRerollCharges=data.grc||0;

    PERSIST.totalItemsSold=data.tsold||0;PERSIST.totalDuplicates=data.tdup||0;
    PERSIST.maxSection=data.ms||1;PERSIST.totalShardsEarned=data.tse||0;
    G.equipped={weapon:null,armor:null,helmet:null,pants:null,amulet:null,ring:null};
    if(data.eq&&typeof data.eq==="object"){for(var ek in data.eq){if(SLOTS.indexOf(ek)!==-1&&data.eq[ek])G.equipped[ek]=data.eq[ek];}}
    G.section=1;G.battle=1;
    G.runStats={kills:0,bosses:0,goldEarned:0,damageDealt:0,crits:0,deaths:0,noHitBoss:false,bossDamaged:false,phoenixUsed:false};
    G.buffs={rage:0,shield:0,guaranteedEgg:false,resurrection:false};
    saveAutoSell();saveProgress();return{ok:true};
  }catch(e){return{ok:false,err:"Ошибка применения"};}}

el("menuBtn").addEventListener("click",function(){if(G.screen==="playing"||G.screen==="loot"||G.screen==="chest")showMenu();});
el("ultBtn").addEventListener("click",function(){fireUltimate();});
el("prestigeBtn").addEventListener("click",function(){if(G.screen==="playing")showPrestigePanel();});
el("eggBtn").addEventListener("click",function(){
  if(G.screen==="chest")eggsReturnScreen="chest";else if(G.screen==="loot")eggsReturnScreen="loot";else eggsReturnScreen=null;
  showEggsPanel();});
el("petBtn").addEventListener("click",function(){if(G.screen==="playing")showPetsPanel();});
var petSlots=document.querySelectorAll(".petSlot");
for(var ps=0;ps<petSlots.length;ps++){petSlots[ps].addEventListener("click",function(){if(G.screen==="playing")showPetsPanel();});}
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(G.screen==="start")startGame();}
  if(e.key==="u"||e.key==="U"||e.key==="г"||e.key==="Г"){if(G.screen==="playing")fireUltimate();}});
resize();initStars();initAmbient();preloadSprites();preloadBackgrounds();
(function boot(){var saved=loadProgress();
  G.gold=saved.gold;G.level=saved.level;G.ultLevel=saved.ultLevel;G.ultCharge=saved.ultCharge;
  G.prestige=saved.prestige;G.prestigeBonus=saved.prestigeBonus;G.eggs=saved.eggs;
  G.firstBossBeaten=saved.firstBossBeaten;G.shards=saved.shards;
  PERSIST.totalBossesKilled=saved.totalBossesKilled;PERSIST.totalEggsOpened=saved.totalEggsOpened;
  PERSIST.totalUltsUsed=saved.totalUltsUsed;PERSIST.totalKills=saved.totalKills;
  PERSIST.totalDeaths=saved.totalDeaths;PERSIST.totalCrits=saved.totalCrits;
  PERSIST.totalItemsSold=saved.totalItemsSold;PERSIST.totalDuplicates=saved.totalDuplicates;
  PERSIST.maxSection=saved.maxSection;PERSIST.totalShardsEarned=saved.totalShardsEarned;
  G.pets={};saved.pets.forEach(function(id){if(getPet(id))G.pets[id]=true;});
  G.specialPets={};saved.specialPets.forEach(function(id){if(getSpecialPet(id))G.specialPets[id]=true;});
  G.activePets=saved.activePets.slice();G.achLevels={};
  for(var kk in saved.achLevels)if(saved.achLevels[kk])G.achLevels[kk]=saved.achLevels[kk];
  G.skills={};for(var skk in saved.skills)if(saved.skills[skk])G.skills[skk]=saved.skills[skk];
  G.rerollCharges=saved.rerollCharges;G.goldRerollCharges=saved.goldRerollCharges;
  PERSIST.autoSell=loadAutoSell();updateSavedInfo();updateAutoSellBtn();updateUltButton();
  console.log("[Слайм-Охотник "+VERSION+"]");})();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
